[build-system]
requires = [
    "Cython>=3.0.6",
    "meson~=1.11.0",
    "meson-python~=0.19.0",
    "ninja~=1.13.0",
]
build-backend = "mesonpy"

[project]
name = "minorminer"
dynamic = ["version"]
authors = [
    {name = "Kelly Boothby"},
]
maintainers = [
    {name = "D-Wave Inc.", email = "tools@dwavesys.com"},
]
license-files = ["LICENSE", "external/glasgow-subgraph-solver/LICENCE", "minorminer/_extern/rpack/LICENSE.md"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">= 3.11"
dependencies = [
    "dwave-graphs>=1.2,<2",
    "fasteners>=0.15",
    "homebase>=1.0.1",
    "networkx>=3.2,<4", # oldest that supports numpy 2
    "numpy>=2,<3",
    "scipy>=1.13",      # oldest that supports numpy 2
]

description = "Heuristic algorithm to find graph minor embeddings."

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/dwavesystems/minorminer"
Download = "https://github.com/dwavesystems/minorminer/releases"

[tool.cibuildwheel]
build-verbosity = "1"
skip = "pp* *musllinux*"
before-test = "pip install -r {project}/tests/requirements.txt"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = "x86_64 aarch64"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# We follow NumPy and don't build universal wheels, see https://github.com/numpy/numpy/pull/20787
archs = "x86_64 arm64"
environment = { MACOSX_DEPLOYMENT_TARGET=10.13 }

[tool.cibuildwheel.windows]
archs = "AMD64"
# before-build = "pip install delvewheel"
# repair-wheel-command = "delvewheel repair {wheel}"

[tool.meson-python.args]
# Statically link the MSVC runtime (/MT) and define NDEBUG in every build, as setup.py did.
# meson-python passes -Db_vscrt=md and -Db_ndebug=if-release unless told otherwise, so
# these repeat the values in meson.build's default_options.
setup = ['-Db_vscrt=mt', '-Db_ndebug=true']
